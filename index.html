      .skip-to-content {

        left: 16px;

        padding: 10px 18px;
        border-radius: 8px;
        font-weight: 600;

        z-index: 99999;
        text-decoration: none;
        transition: top 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .skip-to-content:focus {
        top: 16px;
        outline: 2px solid #ffffff;
        outline-offset: 2px;
      }
